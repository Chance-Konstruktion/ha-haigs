name: Deploy HAIGS website

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "logo.png"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "logo.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp -a docs/. _site/
          cp logo.png _site/assets/haigs-logo.png
          touch _site/.nojekyll

      - name: Check website files and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/site.css
          test -s _site/assets/site.js
          test -s _site/assets/haigs-logo.png
          test -s _site/assets/mark.svg
          node --check _site/assets/site.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
