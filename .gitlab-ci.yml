# Pipeline fuer HAIGS.
#
# Zwei Dinge werden geprueft, die man leicht schleifen laesst:
# der Kern muss ohne Home Assistant importierbar bleiben, und in den
# Tests darf keine Netzanfrage stecken. Beides faellt sonst erst auf,
# wenn es teuer ist.

.ueberall: &ueberall
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    # Befund b aus dem !11-Review: der Tag kriegt alle Waechter --
    # veroeffentlicht wird erst, wenn die Suite gruen ist. Ein v-Tag
    # auf IRGENDEINEM Commit lief bisher ohne einen einzigen Test.
    - if: $CI_COMMIT_TAG

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # Stufe M10: Tag-Pipelines existieren fuer die Auslieferung. Seit
    # dem !11-Nachklapp laufen darauf ALLE Waechter (.ueberall) --
    # veroeffentlicht wird erst, wenn die Suite gruen ist.
    - if: $CI_COMMIT_TAG

stages:
  - form
  - test
  - grenzen
  - auslieferung

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --disable-pip-version-check -r requirements-dev.txt

# --------------------------------------------------------------------
form:
  <<: *ueberall
  stage: form
  script:
    - ruff check .
    - ruff format --check .

tests:
  <<: *ueberall
  stage: test
  variables:
    PYTHONUTF8: "1"
  script:
    - python -m pytest -q

# Die Home-Assistant-Bahn: eigene Umgebung, eigener Job. Der Grund
# ist doppelt -- Home Assistant 2025.2 verlangt Python 3.13, und seine
# Installation wiegt ein paar Minuten. Kern und Waechter bleiben
# schlank; dieses File hier (requirements-ha.txt) ist der einzige
# Ort, an dem beide Pakete zusammengehoeren.
# Das VOLLE python:3.13-Image ist Absicht: slim hat keinen gcc, und
# lru-dict (Home-Assistant-Abhaengigkeit, C-Erweiterung) baut sonst
# nicht -- derselbe Sturz wie einst im alten haigs (Flug 0643 dort).
tests-homeassistant:
  <<: *ueberall
  stage: test
  image: python:3.13
  variables:
    PYTHONUTF8: "1"
  before_script:
    - pip install --quiet --disable-pip-version-check -r requirements-ha.txt
  script:
    - python -m pytest tests_ha -q -p pytest_homeassistant_custom_component

# --------------------------------------------------------------------
# Der Kern haengt nicht an Home Assistant. Das ist keine Stilfrage:
# nur so bleiben die Tests schnell und ohne HA-Installation lauffaehig.
# Seit der Form-Entscheidung zu #11 liegt der Kern in der Integration
# (custom_components/haigs/core); die Anmeldung zum Import macht
# tests/kern_laden.py -- bewusst registriert, nicht auf den Suchpfad.
kern-ohne-homeassistant:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - python -c "import tests.kern_laden; import haigs.core.entdeckung, haigs.core.gitlab_forge, haigs.core.versionen; print('Kern importiert ohne Home Assistant')"
    - |
      if grep -rn "import homeassistant\|from homeassistant" custom_components/haigs/core/; then
        echo "FEHLER: Home Assistant im Kern -- das gehoert in die HA-Schicht"
        exit 1
      fi
      echo "kein Home-Assistant-Import im Kern"

# Form-Waechter zu #11: die Auslieferungsform darf nicht wieder
# auseinanderfallen. Drei Zusagen stehen in ARCHITEKTUR.md (Entscheidung
# 5) -- hier werden sie gegen den Stand geprueft, bei jedem Lauf:
#   1. der Kern liegt in der Integration
#   2. keine zweite Kopie an der Wurzel
#   3. niemand greift nach dem Suchpfad
# So bleibt die Handinstallation aus der README auch nach Wochen noch
# wahr, und der Release-Bauer findet nur noch die neue Form vor.
auslieferungsform:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - |
      set -e
      test -f custom_components/haigs/core/__init__.py || {
        echo "FEHLER: Kern fehlt in der Integration (custom_components/haigs/core)"; exit 1; }
      test -f custom_components/haigs/core/forge.py || {
        echo "FEHLER: forge.py fehlt im Kern -- halber Umzug?"; exit 1; }
      test ! -e haigs || {
        echo "FEHLER: haigs/ an der Wurzel -- zweite Kopie, Form gekippt"; exit 1; }
      if grep -rn "sys\.path" custom_components/; then
        echo "FEHLER: Suchpfad-Griff in der Integration -- genau das war Befund a aus #11"
        exit 1
      fi
      echo "Auslieferungsform stabil: Kern in der Integration, keine Kopie, kein Suchpfad-Griff"

# Anbieterwissen gehoert hinter die Forge-Schnittstelle. Ein Sonderpfad
# im Ablauf faellt hier auf, solange er noch billig zu entfernen ist.
kein-anbieter-sonderpfad:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - |
      # Gesucht ist echter Code, keine Erwaehnung der Regel. Zeilen mit
      # ``...`` sind Dokumentation und zaehlen nicht.
      treffer=$(grep -rnE 'if .*provider *== *"(gitlab|github)"' \
        --include="*.py" custom_components/ \
        | grep -v '``' \
        | grep -v "custom_components/haigs/core/gitlab_forge.py" || true)
      if [ -n "$treffer" ]; then
        echo "$treffer"
        echo "FEHLER: Anbieter-Sonderpfad ausserhalb der Anbieterklasse"
        exit 1
      fi
      echo "kein Sonderpfad gefunden"

# Kein Test darf ins Netz greifen, und die Privatinstanz hat in
# Testdaten nichts verloren. Ein Hostname als reine Zeichenkette
# ("gitlab.com") ist dagegen in Ordnung -- er ruft niemanden an.
tests-ohne-netz:
  <<: *ueberall
  stage: grenzen
  before_script: []
  script:
    - |
      if grep -rnE "import (aiohttp|requests|httpx|socket|urllib)|requests\.(get|post)" tests/ tests_ha/; then
        echo "FEHLER: Netzzugriff in den Tests"
        exit 1
      fi
      if grep -rn "ipv64\.net" tests/ tests_ha/; then
        echo "FEHLER: Privatinstanz in den Testdaten"
        exit 1
      fi
      echo "Tests bleiben trocken"

# --------------------------------------------------------------------
# Stufe M10 -- Nach draussen. Beide Jobs laufen NUR auf Tags; die
# Alltag-Pipeline (Zweige, Merge Requests) bleibt unberuehrt -- aber
# die Waechter laufen auf dem Tag mit (.ueberall), bevor veroeffent-
# licht wird.
#
# auslieferung baut den ZIP deterministisch aus dem ausgecheckten
# Stand (reine Standardbibliothek -- darum ohne pip-Installation) und
# nennt Fingerabdruck und Groesse selbst in der Ausgabe. Der Bau
# verweigert sich, wenn Tag und manifest.json verschiedene Versionen
# nennen -- ein Release, der im Namen etwas anderes verspricht als er
# installiert, ist eine Falle.
auslieferung:
  stage: auslieferung
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - python auslieferung/release_bauen.py dist --version "${CI_COMMIT_TAG}"
  artifacts:
    paths:
      - dist/
    expire_in: never

# verkuendigung traegt den Release ins GitLab ein -- seit dem
# !11-Nachklapp (Befund c) ohne fremdes Image: reine Standard-
# bibliothek auf dem Bild, das ohnehin laeuft. Das Skript laedt den
# ZIP per PUT in die Generic Package Registry des Projekts und legt
# den Eintrag per POST an; beide Aufrufe laufen mit dem JOB-TOKEN
# dieses Jobs -- er gilt nur fuer diesen Lauf und dieses Projekt,
# ist kein zu verwahrendes Geheimnis. Der Anhang-Link zeigt auf die
# Paketadresse (die gilt auch noch, wenn der Job vergangen ist) statt
# auf /-/jobs/<id>/artifacts/... Bleibt der Eintrag aus, liegt der
# ZIP trotzdem als Artefakt des Baus bereit, Fingerabdruck und
# Adresse stehen in dessen Ausgabe.
verkuendigung:
  stage: auslieferung
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: auslieferung
      artifacts: true
  before_script: []
  script:
    - python -m auslieferung.verkuendigen

# github-verkuendigung traegt denselben Stand auf GitHub ein -- mit dem
# ZIP daran. GitHub ist die Ladentheke: HACS installiert nur von dort
# und nur aus Releases. Die Spiegelung schiebt Commits und Tags, aber
# ein GitLab-Release ist ein GitLab-Objekt; drueben entstuende daraus
# nichts. Ohne diesen Job zeigte die README auf eine Release-Seite, auf
# der das versprochene Archiv fehlt.
#
# Braucht GITHUB_TOKEN als maskierte CI-Variable (GITHUB_REPO nur, falls
# das Repo drueben anders heisst). Fehlt das Token, sagt der Job das und
# bleibt gruen -- das GitLab-Release steht ohnehin.
github-verkuendigung:
  stage: auslieferung
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: auslieferung
      artifacts: true
  before_script: []
  script:
    - python -m auslieferung.github_verkuenden
